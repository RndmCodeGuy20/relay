version: '3'

tasks:
  unit:
    cmds:
      - go test ./... -v

  integration:
    cmds:
      # Default: clean, readable, closest to “Jest-like”
      - gotestsum --format testname -- -tags=integration ./internal/ingestion

      # --- Try these formats (uncomment one at a time) ---

      # Minimal, grouped by package (good for large repos)
      # - gotestsum --format pkgname -- -tags=integration ./internal/ingestion

      # Dots style (fast visual feedback, like pytest)
      # - gotestsum --format dots -- -tags=integration ./internal/ingestion

      # Verbose but cleaner than raw go test
      # - gotestsum --format standard-verbose -- -tags=integration ./internal/ingestion

      # Full raw go test passthrough (if debugging deeply)
      # - gotestsum --format standard -- -tags=integration ./internal/ingestion -v

      # Generate JUnit report (useful for CI dashboards)
      # - gotestsum --junitfile junit.xml --format testname -- -tags=integration ./internal/ingestion

    env:
      APP_ENV: test

    dotenv:
      - .env.test
      - .env

  ingest-manual-run:
    cmds:
      - pwsh -NoProfile -File scripts/run-ingest-http.ps1 -FilePath requests/ingest.http {{.CLI_ARGS}}

  race:
    cmds:
      - go test ./... -race

  coverage:
    cmds:
      - go test ./... -coverprofile=coverage.out

  all:
    cmds:
      - task: unit
      - task: race