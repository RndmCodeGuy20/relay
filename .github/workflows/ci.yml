name: CI

on:
  pull_request:
    branches:
      - main
      - master
      - staging
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting (gofmt)
        shell: bash
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests with race and coverage
        run: go test ./... -race -covermode=atomic -coverprofile=coverage.out -v

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: coverage.out

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: relay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d relay_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: relay_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      APP_ENV: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Postgres for logical replication
        shell: bash
        run: |
          CONTAINER_ID="${{ job.services.postgres.id }}"

          docker exec "$CONTAINER_ID" psql -U postgres -d relay_test -c "ALTER SYSTEM SET wal_level = 'logical';"
          docker exec "$CONTAINER_ID" psql -U postgres -d relay_test -c "ALTER SYSTEM SET max_replication_slots = 10;"
          docker exec "$CONTAINER_ID" psql -U postgres -d relay_test -c "ALTER SYSTEM SET max_wal_senders = 10;"

          docker restart "$CONTAINER_ID"

          until docker exec "$CONTAINER_ID" pg_isready -U postgres -d relay_test; do
            sleep 1
          done

          docker exec "$CONTAINER_ID" psql -U postgres -d relay_test -c "SHOW wal_level;"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run integration tests
        run: go test -tags=integration ./internal/ingestion -v

  build:
    name: Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - lint
      - unit-tests
      - integration-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build relay binary
        run: go build -v -o build/relay ./cmd/main.go

      - name: Build migrate binary
        run: go build -v -o build/migrate ./cmd/migrate/main.go

      - name: Validate Docker build
        run: docker build -t relay-ci:${{ github.sha }} .
