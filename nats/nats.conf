# Enable JetStream
jetstream {
  store_dir: "./data/jetstream"
  max_memory_store: 1Gb
  max_file_store: 10Gb
}

# Server settings
port: 4222
http_port: 8222

# Logging
debug: false
trace: false
logtime: true

# Limits (important for testing behavior)
max_payload: 1MB
max_connections: 1000

# Optional: better dev visibility
server_name: "local-nats"